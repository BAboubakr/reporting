name: Wire Atlas enrichment UI
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  wire:
    if: "!contains(github.event.head_commit.message, 'chore: wire Atlas enrichment UI')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire enrichment assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'signal-enrichment.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="signal-enrichment.css?v=20260913-1"/></head>')
          if 'signal-enrichment.js' not in s:
              s=s.replace('<script type="module" src="app.js?v=20260907-REPORT-V3-3"></script>','<script type="module" src="app.js?v=20260907-REPORT-V3-3"></script><script type="module" src="signal-enrichment.js?v=20260913-1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove wiring workflow
        run: |
          git config user.name 'Atlas Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/enrichment-ui.yml
          git add index.html signal-enrichment.css signal-enrichment.js .github/workflows/enrichment-ui.yml
          git commit -m 'chore: wire Atlas enrichment UI' || exit 0
          git push