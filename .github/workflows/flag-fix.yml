name: One-time Morocco flag fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: render accurate Morocco flag') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace flag approximation with true pentagram
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''.morocco-flag{display:inline-block;width:22px;height:15px;margin-right:7px;vertical-align:-2px;background:#c1272d;border:1px solid rgba(0,0,0,.12);border-radius:2px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08)}\n.morocco-flag::before,.morocco-flag::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:2px;background:#006233;transform:translate(-50%,-50%) rotate(0deg);transform-origin:center}\n.morocco-flag::after{transform:translate(-50%,-50%) rotate(60deg)}'''
          new='''.morocco-flag{display:inline-block;width:22px;height:15px;margin-right:7px;vertical-align:-2px;background:#c1272d url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M50 10 73.51 82.36 11.96 37.64 88.04 37.64 26.49 82.36Z%27 fill=%27none%27 stroke=%27%23006233%27 stroke-width=%275%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/12px 12px no-repeat;border:1px solid rgba(0,0,0,.12);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}\n.morocco-flag::before,.morocco-flag::after{display:none}'''
          if old not in s:
              raise SystemExit('Expected old Morocco flag CSS was not found; refusing to modify index.html')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/flag-fix.yml
          git config user.name 'Atlas Flag Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/flag-fix.yml
          git commit -m 'fix: render accurate Morocco flag'
          git push
