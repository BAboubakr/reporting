name: One-time report generator integration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate validated report generator patch
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          app = root / 'app.js'
          patch = root / 'report-generator-PATCH (2).js'
          idx = root / 'data' / 'index.js'
          html = root / 'index.html'

          app_text = app.read_text(encoding='utf-8')
          patch_text = patch.read_text(encoding='utf-8')

          marker = '// === PASTE INTO app.js ==='
          if marker not in patch_text:
              raise SystemExit('Patch marker not found')

          before, after = patch_text.split(marker, 1)
          const_start = before.find('const FICHTNER_BLUE')
          if const_start < 0:
              raise SystemExit('Patch constants not found')
          constants = before[const_start:].strip()
          replacement = after.strip()

          signal_import = "import { signals } from './data/signals.js';"
          if signal_import not in app_text:
              first_import_end = app_text.find('\n', app_text.find('import '))
              if first_import_end < 0:
                  raise SystemExit('Could not locate import section in app.js')
              app_text = app_text[:first_import_end+1] + signal_import + '\n' + app_text[first_import_end+1:]

          const_marker_a = '// === ATLAS REPORT GENERATOR CONSTANTS ===\n'
          const_marker_b = '// === END ATLAS REPORT GENERATOR CONSTANTS ===\n'
          if const_marker_a in app_text and const_marker_b in app_text:
              a = app_text.index(const_marker_a)
              b = app_text.index(const_marker_b, a) + len(const_marker_b)
              app_text = app_text[:a] + app_text[b:]

          anchor = "const localDevelopments = saved.developments || [];"
          if anchor not in app_text:
              raise SystemExit('Expected app.js anchor not found')
          const_block = f"\n\n{const_marker_a}{constants}\n{const_marker_b}"
          app_text = app_text.replace(anchor, anchor + const_block, 1)

          def find_statement_end(text, start):
              brace = text.find('{', start)
              if brace < 0:
                  raise ValueError('opening brace not found')
              depth = 0
              i = brace
              state = None
              escaped = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i+1 < len(text) else ''
                  if state:
                      if state == 'line_comment':
                          if c == '\n': state = None
                      elif state == 'block_comment':
                          if c == '*' and n == '/': state = None; i += 1
                      elif state in ('single','double','template'):
                          if escaped:
                              escaped = False
                          elif c == '\\':
                              escaped = True
                          elif c == {'single':"'", 'double':'"', 'template':'`'}[state]:
                              state = None
                  else:
                      if c == '/' and n == '/': state = 'line_comment'; i += 1
                      elif c == '/' and n == '*': state = 'block_comment'; i += 1
                      elif c == "'": state = 'single'
                      elif c == '"': state = 'double'
                      elif c == '`': state = 'template'
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              j = i + 1
                              while j < len(text) and text[j].isspace(): j += 1
                              if text.startswith(');', j): j += 2
                              elif text.startswith(';', j): j += 1
                              return j
                  i += 1
              raise ValueError('matching brace not found')

          while True:
              p = app_text.find("$('printPdf')")
              if p < 0: break
              end = app_text.find(';', p)
              if end < 0: raise SystemExit('Could not remove printPdf handler')
              app_text = app_text[:p] + app_text[end+1:]

          while True:
              p = app_text.find("$('downloadPpt')")
              if p < 0: break
              try:
                  end = find_statement_end(app_text, p)
              except ValueError as e:
                  raise SystemExit(str(e))
              app_text = app_text[:p] + app_text[end:]

          app_text = app_text.rstrip() + '\n\n' + replacement + '\n'
          app.write_text(app_text, encoding='utf-8')

          idx_text = idx.read_text(encoding='utf-8')
          idx_text = idx_text.replace("\nimport '../ppt-report.js';", '')
          idx.write_text(idx_text, encoding='utf-8')

          html_text = html.read_text(encoding='utf-8')
          html_text = re.sub(r'<script src="ppt-report\\.js[^>]*></script>', '', html_text)
          html.write_text(html_text, encoding='utf-8')

          if signal_import not in app_text: raise SystemExit('signals import missing')
          if "$('downloadPpt')" not in app_text: raise SystemExit('new downloadPpt handler missing')
          if "$('printPdf')" not in app_text: raise SystemExit('new printPdf handler missing')
          if 'reportableSignals' not in app_text: raise SystemExit('reportableSignals missing')
          if '005AAF' not in app_text: raise SystemExit('Fichtner blue missing')
          if 'window.print()' in app_text: raise SystemExit('legacy print handler remains')

      - name: Commit integrated report generator and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/integrate-report-generator.yml
          git add app.js data/index.js index.html
          git diff --cached --check
          git commit -m "feat: brand PPTX/PDF report generator, wire to live signals, filter collector noise"
          git push
