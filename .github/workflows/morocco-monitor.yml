name: Morocco Intelligence Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'data/signals.js'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Morocco market and competitor signals
        run: python scripts/monitor.py
      - name: Commit updated intelligence
        run: |
          git config user.name 'Atlas Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/signals.js
          git diff --cached --quiet || git commit -m 'chore: update Morocco intelligence signals'
          git push
