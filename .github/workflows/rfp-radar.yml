name: Refresh Morocco Public RFP Radar

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morocco-public-rfp-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official procurement notices
        run: python scripts/rfp_radar.py
      - name: Commit radar feed and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rfp-opportunities.json data/rfp-history.json data/rfp-source-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Morocco public RFP radar"
            git push
          fi

