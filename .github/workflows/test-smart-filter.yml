name: Test Atlas Smart Filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-smart-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Smart Filter test
        run: python scripts/test_smart_filter.py
