<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 541 541" role="img" aria-labelledby="title desc"><title id="title">Morocco administrative regions</title><desc id="desc">Map outline divided into Morocco’s 12 administrative regions. Adapted from morocco-svg-map (MIT); use as geographic context only.</desc><rect width="541" height="541" fill="#f7faf8"/><g filter="url(#outer)"><defs><filter id="outer" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="wide"/><feComposite in="wide" in2="SourceAlpha" operator="out" result="edge"/><feFlood flood-color="#39806d" result="color"/><feComposite in="color" in2="edge" operator="in" result="outline"/><feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="" fill="#e2efe9" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Dakhla-Oued Ed-Dahab</title></path>\n<path d="" fill="#d8e9e1" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Guelmim-Oued Noun</title></path>\n<path d="" fill="#eaf3ee" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Laayoune-Sakia El Hamra</title></path>\n<path d="" fill="#dcebe4" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Souss-Massa</title></path>\n<path d="" fill="#e6f0eb" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Draa-Tafilalet</title></path>\n<path d="" fill="#d7e7df" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Ben Melal-Khenifra</title></path>\n<path d="" fill="#e7f1ec" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Rabat-Sale-Kenitra</title></path>\n<path d="" fill="#dbe9e2" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Marrakech-Safi</title></path>\n<path d="" fill="#eaf3ee" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Casablanca-Settat</title></path>\n<path d="" fill="#dcebe4" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Tanger-Tétouan-Al Hoceïma</title></path>\n<path d="" fill="#e4efe9" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Fes-Meknes</title></path>\n<path d="" fill="#d7e8e0" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><title>Oriental</title></path></g></svg>